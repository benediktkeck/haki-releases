name: Sign preview update
run-name: Sign Haki ${{ inputs.version }} preview update
on:
  workflow_dispatch:
    inputs:
      version:
        description: Already-published preview version (major.minor.patch)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: preview-signing
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - name: Download selected public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          gh release view "v$VERSION" --json isDraft,tagName > release-selection.json
          node -e 'const r=require("./release-selection.json"); if(r.isDraft || r.tagName!=="v"+process.env.VERSION) process.exit(1)'
          gh release download "v$VERSION" --dir bundle --pattern release.json \
            --pattern "haki-server-$VERSION-linux-x64.tgz" --pattern "haki-server-$VERSION-win32-x64.zip"
          node -e 'const r=require("./bundle/release.json"); if(r.version!==process.env.VERSION) process.exit(1)'
      - name: Verify archive hashes and sign metadata
        env:
          HAKI_RELEASE_SIGNING_KEY: ${{ secrets.HAKI_RELEASE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: >-
          node tools/sign-update.mjs --bundle bundle --output preview.json
          --public-key publisher-public.pem
          --base-url "https://github.com/$GH_REPO/releases/download/v$VERSION/"
      - name: Publish signed preview feed without version regression
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/publish-update.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: signed-preview-${{ inputs.version }}
          path: preview.json
          if-no-files-found: error
